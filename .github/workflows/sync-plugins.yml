name: Check provider plugins are in sync

# skills/ is the source of truth; providers/*/plugin/skills/ are copies written by
# scripts/sync-plugins.mjs. This fails when the committed copies don't match, so a skill change
# can't ship to one harness and silently miss the others.
#
# A check, not a bot push: the main ruleset only accepts reviewed PRs, so the copies have to land
# in the same PR as the skill change. No path filter, so it can be a required status check
# without leaving unrelated PRs waiting on it. The push run flags drift that reaches main anyway.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  providers-in-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Sync
        run: node scripts/sync-plugins.mjs

      - name: Fail if the copies changed
        run: |
          # status, not diff: a new skill shows up as untracked files, which diff ignores.
          drift=$(git status --porcelain -- providers)

          if [ -z "$drift" ]; then
            echo "Provider plugins are in sync."
            exit 0
          fi

          echo "$drift"
          echo "::error::providers/*/plugin/skills/ is out of date. Run 'node scripts/sync-plugins.mjs' and commit the result."
          exit 1
