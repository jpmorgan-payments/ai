name: Sync skills into provider plugins

# skills/ is the source of truth; providers/*/plugin/skills/ are copies. This keeps them in
# step so a skill change can't ship to one harness and silently miss the others.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/sync-plugins.mjs"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # this job pushes

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the refreshed copies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false # token is scoped to the push step

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Sync
        run: node scripts/sync-plugins.mjs

      - name: Commit if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          git add providers

          if git diff --staged --quiet; then
            echo "Provider plugins already in sync, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync skills into provider plugins"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
